<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 天平校验系统</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="login-box">
    <div class="login-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
        </svg>
    </div>
    <h2>天平校验系统</h2>
    <p class="placeholder">内网运行 · 电子天平日常校验记录</p>
    <form method="post" th:action="@{/login}">
        <input type="text" name="username" placeholder="账号" required autofocus>
        <input type="password" name="password" placeholder="密码" required>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <button class="btn btn-block" type="submit">登录</button>
    </form>
    <p class="muted" style="margin-top:16px">演示账号：admin / liyi / lier / qiyi，密码均为 123456</p>
</div>
</body>
</html>
