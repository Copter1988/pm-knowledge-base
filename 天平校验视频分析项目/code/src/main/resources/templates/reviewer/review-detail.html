<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('复核记录详情')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card">
        <h2>复核记录详情</h2>
        <p>
            <strong th:text="${detail.recordNo}">记录号</strong>
            <span class="badge"
                  th:classappend="${detail.status == '已复核' ? 'ok' : (detail.status == '待复核' ? 'info' : 'bad')}"
                  th:text="${detail.status}">状态</span>
        </p>

        <table class="grid">
            <tr>
                <th>检验人员</th><td th:text="${detail.checkerName ?: '-'}"></td>
                <th>最终天平</th><td th:text="${detail.balanceCode ?: '-'}"></td>
            </tr>
            <tr>
                <th>科室</th><td th:text="${detail.dept ?: '-'}"></td>
                <th>设备唯一号</th><td th:text="${detail.uniqueNo ?: '-'}"></td>
            </tr>
            <tr>
                <th>砝码盒</th><td th:text="${detail.weightBoxNo ?: '-'}"></td>
                <th>校验日期</th><td th:text="${detail.checkDate ?: '-'}"></td>
            </tr>
            <tr>
                <th>量程 / 精度</th><td colspan="3" th:text="${detail.rangeText ?: '-'}"></td>
            </tr>
            <tr>
                <th>判定结论</th>
                <td>
                    <span class="badge"
                          th:classappend="${detail.judge.qualified} ? 'ok' : 'bad'"
                          th:text="${detail.judge.resultText ?: '未判定'}"></span>
                </td>
                <th>复核人员</th><td th:text="${detail.reviewerName ?: '-'}"></td>
            </tr>
        </table>

        <h3>称量前置条件</h3>
        <table class="grid">
            <tr>
                <th>清洁是否符合要求</th><td th:text="${detail.cleanText}"></td>
                <th>水平调节是否到位</th><td th:text="${detail.levelText}"></td>
                <th>内部校正</th><td th:text="${detail.internalCalibOk ?: '-'}"></td>
            </tr>
        </table>

        <h3>九次称量值</h3>
        <table class="grid">
            <thead>
            <tr>
                <th>次别</th>
                <th>组</th>
                <th>标称值(g)</th>
                <th>天平实际显示</th>
                <th>换算值(g)</th>
                <th>偏差</th>
                <th>测量时间</th>
                <th>判定</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${detail.judge.details}">
                <td th:text="${r.level + '-' + ((r.seq - 1) % 3 + 1)}"></td>
                <td th:text="${r.level}"></td>
                <td th:text="${r.nominal ?: '-'}"></td>
                <td th:text="${r.displayText ?: '未识别'}"></td>
                <td th:text="${r.value ?: '-'}"></td>
                <td th:text="${r.deviationText}"></td>
                <td th:text="${r.measureTime ?: '-'}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${r.qualified} ? 'ok' : 'bad'"
                          th:text="${r.qualified ? '合格' : '不合格'}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${not #lists.isEmpty(detail.judge.failReasons)}">
            <h3>不合格原因</h3>
            <ul>
                <li th:each="reason : ${detail.judge.failReasons}" th:text="${reason}"></li>
            </ul>
        </div>

        <div th:if="${not #lists.isEmpty(detail.traces)}">
            <h3>人工改值留痕</h3>
            <ul>
                <li th:each="trace : ${detail.traces}" th:text="${trace}"></li>
            </ul>
        </div>

        <p><strong>备注：</strong><span th:text="${detail.remark ?: '无'}"></span></p>

        <div th:if="${not #lists.isEmpty(detail.templateFields)}">
            <h3>记录模板补充信息</h3>
            <table class="grid">
                <tr><th>字段</th><th>内容</th><th>要求</th></tr>
                <tr th:each="field : ${detail.templateFields}">
                    <td th:text="${field.fieldLabel}"></td>
                    <td th:text="${field.value ?: '-'}"></td>
                    <td th:text="${field.required ? '必填' : '选填'}"></td>
                </tr>
            </table>
        </div>

        <div th:if="${videoUrl != null}">
            <h3>原始校验视频</h3>
            <p class="muted" th:text="${videoName ?: '校验视频'}"></p>
            <video class="video" controls preload="metadata" th:src="${videoUrl}"></video>
        </div>

        <div class="query-form">
            <a class="btn" th:href="@{/reviewer/curve(recordId=${detail.recordId})}">查看称重值曲线</a>
            <a class="btn" th:if="${detail.status == '已复核'}"
               th:href="@{/reviewer/export/pdf(recordId=${detail.recordId})}">下载 PDF</a>
            <a class="btn" th:href="@{/reviewer/review/pending}">返回待复核列表</a>
        </div>

        <div th:if="${detail.status == '待复核'}">
            <h3>复核处理</h3>
            <form th:action="@{/reviewer/review/confirm}" method="post" style="display:inline">
                <input type="hidden" name="recordId" th:value="${detail.recordId}">
                <button class="btn" type="submit">确认复核</button>
            </form>
            <form th:action="@{/reviewer/review/reject}" method="post" style="display:inline">
                <input type="hidden" name="recordId" th:value="${detail.recordId}">
                <input type="text" name="reason" placeholder="打回原因（可选）" size="30">
                <button class="btn" type="submit">打回</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
