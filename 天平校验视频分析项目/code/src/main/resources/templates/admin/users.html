<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('账号维护')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card">
        <h2>账号维护</h2>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form class="form-grid" th:action="@{/admin/users/add}" method="post">
            <label>账号</label>
            <input type="text" name="username" required>
            <label>姓名</label>
            <input type="text" name="realName" required>
            <label>角色</label>
            <select name="role">
                <option value="CHECKER">检验人员</option>
                <option value="REVIEWER">复核人员</option>
                <option value="ADMIN">管理员</option>
            </select>
            <label>校验员卡号（可选）</label>
            <input type="text" name="cardCode" placeholder="例如 JY009">
            <div></div>
            <button class="btn" type="submit">新增账号</button>
        </form>
        <p class="muted">新账号默认密码 123456。</p>

        <table class="grid">
            <thead>
            <tr><th>账号</th><th>姓名</th><th>角色</th><th>卡号</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.realName}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.cardCode ?: '-'}"></td>
                <td th:text="${u.enabled == 1 ? '启用' : '停用'}"></td>
                <td>
                    <form th:action="@{/admin/users/disable}" method="post" style="display:inline" th:if="${u.enabled == 1}">
                        <input type="hidden" name="userId" th:value="${u.id}">
                        <button class="btn" type="submit">停用</button>
                    </form>
                    <form th:action="@{/admin/users/enable}" method="post" style="display:inline" th:if="${u.enabled != 1}">
                        <input type="hidden" name="userId" th:value="${u.id}">
                        <button class="btn" type="submit">启用</button>
                    </form>
                    <form th:action="@{/admin/users/reset-password}" method="post" style="display:inline">
                        <input type="hidden" name="userId" th:value="${u.id}">
                        <button class="btn" type="submit">重置密码</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
