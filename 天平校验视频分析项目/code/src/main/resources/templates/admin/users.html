<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('账号维护')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card">
        <h2>账号维护</h2>
        <p class="placeholder">TODO 迭代2：增加/删减检验、复核人员，重置密码。</p>
        <table class="grid">
            <thead>
            <tr><th>账号</th><th>姓名</th><th>角色</th><th>状态</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}"></td>
                <td th:text="${u.realName}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.enabled == 1 ? '启用' : '停用'}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
