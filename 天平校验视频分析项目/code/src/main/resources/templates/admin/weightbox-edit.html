<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('编辑砝码盒')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card">
        <h2>编辑砝码盒</h2>
        <form class="form-grid" th:action="@{/admin/masterdata/weightbox/edit}" method="post">
            <input type="hidden" name="id" th:value="${box.id}">
            <label>盒号</label>
            <input type="text" name="boxNo" th:value="${box.boxNo}" required>
            <label>备注</label>
            <input type="text" name="remark" th:value="${box.remark}" placeholder="可选">
            <div></div>
            <button class="btn" type="submit">保存</button>
        </form>
    </div>
</div>
</body>
</html>
