<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('称重值曲线')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card">
        <h2>称重值曲线</h2>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <div th:if="${curve != null}">
            <p><strong th:text="${curve.recordNo}"></strong>
                <span class="muted" th:text="|${curve.balanceCode} · ${curve.checkDate} · ${curve.resultText}|"></span></p>
            <p class="notice">L1、L2、L3 各一图；每组仅用竖线连接 3 个示值中的最小值与最大值。纵轴默认放大到标称值 ±0.2%。</p>
            <img class="curve-image" th:src="${curveImage}" alt="称重值趋势图">
            <table class="grid">
                <tr><th>次别</th><th>组</th><th>天平实际显示</th><th>换算示值(g)</th><th>测量时间</th><th>下限(g)</th><th>上限(g)</th><th>判定</th></tr>
                <tr th:each="p : ${curve.points}">
                    <td th:text="${p.level + '-' + ((p.seq - 1) % 3 + 1)}"></td>
                    <td th:text="${p.level}"></td>
                    <td th:text="${p.displayText ?: '-'}"></td>
                    <td th:text="${p.value}"></td>
                    <td th:text="${p.measureTime ?: '-'}"></td>
                    <td th:text="${p.lower}"></td>
                    <td th:text="${p.upper}"></td>
                    <td th:text="${p.qualified} ? '合格' : '不合格'"></td>
                </tr>
            </table>
        </div>
        <p class="placeholder" th:if="${curve == null && error == null}">请从记录查询页选择一个记录查看曲线。</p>
    </div>
</div>
</body>
</html>
