<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('核对并提交')}"></head>
<body>
<nav th:replace="~{fragments/layout :: topbar}"></nav>
<div class="container">
    <div class="card" th:if="${result == null}">
        <h2>核对并提交</h2>
        <p class="placeholder">请先导入视频。</p>
        <a class="btn" th:href="@{/checker/record/import}">去导入</a>
    </div>

    <div class="card" th:if="${result != null}">
        <h2>核对并提交</h2>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <p>
            <span class="badge" th:classappend="${result.canCreateRecord()} ? 'ok' : 'bad'"
                  th:text="${result.canCreateRecord()} ? '可进入记录核对' : '存在阻断问题'"></span>
        </p>

        <table class="grid">
            <tr><th>最终人员</th><td th:text="${result.effectivePersonName ?: '未确定'}"></td>
                <th>最终天平</th><td th:text="${result.effectiveBalanceCode ?: '未确定'}"></td></tr>
            <tr><th>视频内校验员卡</th><td th:text="${result.checkerCardCode ?: '未识别'}"></td>
                <th>账号绑定卡</th><td th:text="${result.expectedCheckerCardCode ?: '未配置'}"></td></tr>
            <tr><th>校验员卡匹配</th><td>
                    <span class="badge ok" th:if="${result.checkerCardMatched == true}">匹配</span>
                    <span class="badge bad" th:if="${result.checkerCardMatched == false}">不匹配</span>
                    <span class="muted" th:if="${result.checkerCardMatched == null}">未识别</span>
                </td>
                <th>校验日期</th><td th:text="${result.checkDate ?: '-'}"></td></tr>
        </table>

        <video class="video" th:if="${videoUrl != null}" th:src="${videoUrl}" controls preload="metadata"></video>

        <div th:if="${!result.canCreateRecord()}">
            <p class="error" th:if="${result.blockingMessage != null}" th:text="${result.blockingMessage}"></p>
            <p class="error" th:if="${result.blockingMessage == null}">人员或天平身份无法确定，不能建立校验记录。</p>
            <a class="btn" th:href="@{/checker/record/import}">返回重新导入</a>
        </div>

        <form th:if="${result.canCreateRecord()}" th:action="@{/checker/record/submit}" method="post">
            <table class="grid">
                <tr>
                    <th>清洁是否符合要求</th>
                    <td>
                        <label><input type="radio" name="cleanOk" value="1" checked> 是</label>
                        <label><input type="radio" name="cleanOk" value="0"> 否</label>
                    </td>
                    <th>水平调节是否到位</th>
                    <td>
                        <label><input type="radio" name="levelOk" value="1" checked> 是</label>
                        <label><input type="radio" name="levelOk" value="0"> 否</label>
                    </td>
                    <th>内部校正</th>
                    <td>
                        <select name="calibOk">
                            <option value="是">是</option>
                            <option value="否">否</option>
                            <option value="NA">NA</option>
                        </select>
                    </td>
                </tr>
            </table>

            <p class="notice">请核对下方 9 次示值（可人工改值，改值会留痕），确认无误后点「提交复核」。</p>
            <p><button class="btn" type="submit">提交复核</button></p>

            <h3>9 次示值（可人工改值，支持 g/mg）</h3>
            <table class="grid">
                <tr><th>次别</th><th>组</th><th>标称值(g)</th><th>天平实际显示（含单位）</th><th>测量时间</th></tr>
                <tr th:each="r : ${result.readings}">
                    <td th:text="${r.level + '-' + ((r.seq - 1) % 3 + 1)}"></td>
                    <td th:text="${r.level}"></td>
                    <td th:text="${r.nominal ?: '-'}"></td>
                    <td><input type="text" name="v"
                               th:value="${r.rawValue == null ? '' : r.rawValue + ' ' + r.displayUnit}"
                               placeholder="留空表示未识别"></td>
                    <td><input type="text" name="mt" th:value="${r.measureTime ?: ''}" placeholder="yyyy-MM-dd HH:mm"></td>
                </tr>
            </table>

            <p><label>备注：</label><input type="text" name="remark" size="60" placeholder="留空自动采用判定预填"></p>

            <button class="btn" type="submit">提交复核</button>
        </form>

        <p class="notice" th:if="${result.canCreateRecord()}">提交后示值锁定并进入待复核；改值会写入 read_trace 留痕。</p>
    </div>
</div>
</body>
</html>
