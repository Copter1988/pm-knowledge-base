<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="54" fill="#14315c"/>
  <rect x="20" y="20" width="15" height="15" rx="3" fill="#58a6ff"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#ffffff"><text x="44" y="34">天平校验系统</text></g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#c3d3ea">
    <text x="200" y="34">待复核确认</text>
    <text x="291" y="34">全部校验记录</text>
    <text x="401" y="34" fill="#ffffff">模板与天平维护</text>
    <rect x="401" y="41" width="91" height="2" fill="#58a6ff"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="12.5" fill="#d7e3f5">
    <rect x="1052" y="14" width="148" height="26" rx="13" fill="none" stroke="#3b6099"/>
    <text x="1126" y="31" text-anchor="middle">齐一 · 复核确认人员</text>
    <text x="1215" y="31" fill="#c3d3ea">退出</text>
  </g>
  <rect x="0" y="54" width="186" height="746" fill="#f5f7fb"/>
  <line x1="186" y1="54" x2="186" y2="800" stroke="#e3e8f0"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="13">
    <text x="24" y="93" fill="#43536e">待复核确认</text>
    <circle cx="158" cy="88" r="9" fill="#dc2626"/>
    <text x="158" y="92" font-size="11.5" fill="#ffffff" text-anchor="middle">3</text>
    <text x="24" y="135" fill="#43536e">全部校验记录</text>
    <rect x="10" y="152" width="166" height="32" rx="7" fill="#1b4f91"/>
    <text x="24" y="173" fill="#ffffff" font-weight="700">模板与天平维护</text>
  </g>

  <g font-family="Microsoft YaHei, sans-serif">
    <!-- 页面标题 + 子选项卡 -->
    <text x="206" y="86" font-size="17" font-weight="700" fill="#14315c">模板与天平维护</text>
    <text x="340" y="86" font-size="12" fill="#64748b">天平清单 · 砝码与判定要求 · 校验记录模板</text>
    <rect x="700" y="68" width="86" height="26" rx="6" fill="#1b4f91"/>
    <text x="743" y="86" font-size="12" fill="#ffffff" text-anchor="middle">+ 新增天平</text>
    <g font-size="12.5">
      <rect x="206" y="100" width="92" height="26" rx="6" fill="#1b4f91"/>
      <text x="252" y="118" fill="#ffffff" text-anchor="middle" font-weight="700">天平清单</text>
      <rect x="308" y="100" width="130" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="373" y="118" fill="#334155" text-anchor="middle">砝码与判定要求</text>
      <rect x="448" y="100" width="110" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="503" y="118" fill="#334155" text-anchor="middle">校验记录模板</text>
    </g>

    <!-- 左：天平清单列表 -->
    <rect x="206" y="140" width="580" height="28" fill="#f5f7fb"/>
    <g font-size="12.5" font-weight="700" fill="#43536e">
      <text x="220" y="159">编号</text><text x="272" y="159">唯一号</text><text x="386" y="159">量程</text>
      <text x="470" y="159">精度</text><text x="596" y="159">频次</text>
    </g>
    <rect x="206" y="168" width="580" height="34" fill="#fff8ec"/>
    <g stroke="#eef2f7">
      <line x1="206" y1="202" x2="786" y2="202"/><line x1="206" y1="236" x2="786" y2="236"/><line x1="206" y1="270" x2="786" y2="270"/>
    </g>
    <g font-size="12.5" fill="#26303f">
      <text x="220" y="189" font-weight="700" fill="#14315c">F001</text><text x="272" y="189">SJS2605002</text><text x="386" y="189">220 g</text><text x="470" y="189">0.1 mg</text><text x="596" y="189">每天</text>
      <text x="220" y="223" font-weight="700" fill="#14315c">F002</text><text x="272" y="223">SJS2605003</text><text x="386" y="223">120 g / 40 g</text><text x="470" y="223">0.1 / 0.01 mg</text><text x="596" y="223">每天</text>
      <text x="220" y="257" font-weight="700" fill="#14315c">F003</text><text x="272" y="257">SJS2605004</text><text x="386" y="257">220 g</text><text x="470" y="257">1 mg</text><text x="596" y="257">每周</text>
      <text x="220" y="291" font-weight="700" fill="#14315c">F004</text><text x="272" y="291">SJS2605011</text><text x="386" y="291">3200 g</text><text x="470" y="291">10 mg</text><text x="596" y="291">每天</text>
    </g>

    <!-- 右：编辑表单 -->
    <rect x="800" y="80" width="460" height="704" rx="9" fill="#ffffff" stroke="#e3e8f0"/>
    <text x="818" y="106" font-size="13.5" font-weight="700" fill="#14315c">编辑天平 F001</text>

    <g font-size="11.5" fill="#64748b">
      <text x="818" y="130">天平编号</text><text x="1038" y="130">天平唯一号（设备自带，≤20 位）</text>
      <text x="818" y="184">科室</text><text x="1038" y="184">天平量程数量</text>
      <text x="818" y="238">第一量程 Max</text><text x="1038" y="238">第一量程精度 d</text>
      <text x="818" y="292">第二量程 Max（双量程时填写）</text><text x="1038" y="292">第二量程精度 d</text>
      <text x="818" y="346">内部校正方式</text><text x="1038" y="346">校验频次</text>
      <text x="818" y="400">砝码盒唯一号（≤10 位）</text><text x="1038" y="400">测量砝码 L1 / L2 / L3</text>
    </g>
    <g font-size="12.5">
      <rect x="818" y="138" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="832" y="159" font-weight="700" fill="#14315c">F001</text>
      <rect x="1038" y="138" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1052" y="159" font-weight="700" fill="#14315c">SJS2605002</text>
      <rect x="818" y="192" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="832" y="213" font-weight="700" fill="#14315c">化学室</text>
      <rect x="1038" y="192" width="204" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="1052" y="213" fill="#334155">单量程 ▾</text>
      <rect x="818" y="246" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="832" y="267" font-weight="700" fill="#14315c">220 g</text>
      <rect x="1038" y="246" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1052" y="267" font-weight="700" fill="#14315c">0.1 mg</text>
      <rect x="818" y="300" width="204" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="832" y="321" fill="#94a3b8">—</text>
      <rect x="1038" y="300" width="204" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="1052" y="321" fill="#94a3b8">—</text>
      <rect x="818" y="354" width="204" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="832" y="375" fill="#334155">手动触发 ▾</text>
      <rect x="1038" y="354" width="204" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="1052" y="375" fill="#334155">每天 ▾</text>
      <rect x="818" y="408" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="832" y="429" font-weight="700" fill="#14315c">FM2512920</text>
      <rect x="1038" y="408" width="204" height="32" rx="6" fill="#f7f9fc" stroke="#cbd5e1"/><text x="1052" y="429" font-weight="700" fill="#14315c">200 g / 50 g / 10 g</text>
    </g>

    <rect x="818" y="460" width="424" height="72" rx="8" fill="#effaf3" stroke="#b7e6cd"/>
    <text x="834" y="482" font-size="12.5" fill="#0f7a3d">✔ 限度由系统按 (1±0.05%)L 实时计算：</text>
    <text x="834" y="502" font-size="11.5" fill="#0f7a3d">199.9000~200.1000 g · 49.9750~50.0250 g</text>
    <text x="834" y="520" font-size="11.5" fill="#0f7a3d">9.9950~10.0050 g（不引用纸质表格中写死的限度值）</text>

    <rect x="818" y="548" width="70" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="853" y="569" font-size="13" fill="#334155" text-anchor="middle">重置</text>
    <rect x="898" y="548" width="80" height="32" rx="6" fill="#1b4f91"/>
    <text x="938" y="569" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">保存</text>
    <rect x="1030" y="548" width="212" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1136" y="569" font-size="12.5" fill="#334155" text-anchor="middle">设计 / 修改校验记录模板</text>

    <text x="818" y="606" font-size="11.5" fill="#94a3b8">提示：主数据的天平编号 / 唯一号 / 量程 / 精度是视频识别结果的比对基准，</text>
    <text x="818" y="624" font-size="11.5" fill="#94a3b8">修改后将影响之后所有校验记录的纠错判定。</text>
  </g>
</svg>
