      <stop offset="0" stop-color="#14315c"/><stop offset="0.55" stop-color="#1b4f91"/><stop offset="1" stop-color="#2f7ec4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
